name: WenCai intraday all-time highs
on:
  workflow_dispatch:
  push:
    paths:
      - 'wencai_ath.py'
      - '.github/workflows/wencai-ath.yml'
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WenCai client
        run: pip install 'pywencai>=0.12' pandas
      - name: Query 2026-10-30 intraday ATH candidates
        env:
          ATH_TRADE_DATE: '20261030'
        run: python -u wencai_ath.py
      - name: Commit raw results and diagnostics
        if: always()
        run: |
          if [ -f data/ath_wencai_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ath_wencai_latest.json
            git diff --cached --quiet || (git commit -m "data: record WenCai intraday ATH query results" && git push)
          fi
