name: A-share historical-high tracker
on:
  workflow_dispatch:
  push:
    paths:
      - 'tracker.py'
  schedule:
    - cron: '25 8 * * 1-5' # 16:25 Beijing, weekdays; holidays skipped by trade calendar
permissions:
  contents: write
concurrency:
  group: ashare-tracker
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Environment diagnostics
        run: |
          echo "::group::Runtime"
          date -u
          python --version
          git rev-parse --short HEAD
          echo "::endgroup::"
      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install -r requirements.txt
          python -m pip show tushare pandas
      - name: Check Tushare secret availability
        env:
          TUSHARE_TOKEN: ${{ secrets.tushare_key }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "::error title=Missing Tushare secret::Set repository Actions secret tushare_key"
            exit 1
          fi
          echo "Tushare secret present (value hidden)"
      - name: Compile Python sources
        run: python -m compileall -q tracker.py sector_monitor.py test_sector_monitor.py backtest.py test_backtest.py
      - name: Validate sector monitor
        run: python -m unittest -v test_sector_monitor test_backtest
      - name: Scan and checkpoint
        env:
          TUSHARE_TOKEN: ${{ secrets.tushare_key }}
          BATCH_SIZE: '25'
        run: python -u tracker.py
      - name: Build daily sector attention report
        if: always()
        run: python sector_monitor.py
      - name: Run historical research backtest
        if: always()
        run: python -u backtest.py
      - name: Commit verified data and progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: update A-share scan and MA10 watchlist"
            git push
          fi
