name: iFinD official intraday ATH candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'ifind_ath.py'
      - '.github/workflows/ifind-ath.yml'
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: pip install requests
      - name: Query iFinD smart stock picking
        env:
          ATH_TRADE_DATE: '20261030'
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
          IFIND_ACCESS_TOKEN: ${{ secrets.IFIND_ACCESS_TOKEN }}
        run: python -u ifind_ath.py
      - name: Save diagnostics and raw API response
        if: always()
        run: |
          if [ -f data/ath_ifind_latest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ath_ifind_latest.json
            git diff --cached --quiet || (git commit -m "data: record official iFinD ATH candidates and diagnostics" && git push)
          fi
