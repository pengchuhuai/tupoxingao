name: Wencai historical-high candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ths-ath.yml'
      - 'fetch_wencai_ath.py'
  schedule:
    - cron: '15 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: wencai-ath-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Wencai client
        run: pip install 'pywencai>=0.12' 'pandas>=2.1,<3'
      - name: Fetch Wencai candidates
        run: python -u fetch_wencai_ath.py
      - name: Commit Wencai snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ath_wencai_latest.json
          git diff --cached --quiet || (git commit -m "Update Wencai ATH candidates" && git push)
