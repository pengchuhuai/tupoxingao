name: Direct THS historical-high ranking
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ths-ath-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source client
        run: pip install 'akshare>=1.16' pandas
      - name: Fetch THS all-time-high ranking
        run: python -u fetch_ath_source.py
      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ath_source_latest.json
          git diff --cached --quiet || (git commit -m "Update THS historical-high source snapshot" && git push)
